[project]
name = "hivewire"
version = "0.4.4"
description = "Hivewire: independent coding agents, accountable teamwork through a shared local Git workflow."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/ifinsta/hivewire"
Issues = "https://github.com/ifinsta/hivewire/issues"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "PLW1510"]
ignore = ["B904", "E501"]  # the formatter owns line length; long messages stay on one line
