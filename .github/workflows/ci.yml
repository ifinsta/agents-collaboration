name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Environment intelligence is the point of this project, so every change is
    # proved on all three operating systems agents actually run on.
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: |
          python -m pip install --quiet ruff
          python -m ruff check .
      - name: The manifest matches the skill files
        run: python scripts/make_manifest.py --check
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: The detected environment (for the log)
        run: python skills/agents-collaboration/swarm.py environment
